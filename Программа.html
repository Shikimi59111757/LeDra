<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рисование</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div class="app">

  <section class="sheet task" id="taskSheet">
    <header class="task-head">
      <div class="meta"><span id="weekNo"></span><span id="counter"></span></div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
      <p class="week-title" id="weekTitle"></p>
      <h1 id="title"></h1>
    </header>

    <dl class="spec">
      <div class="row"><dt>Разминка<span>5 мин</span></dt><dd id="warm"></dd></div>
      <div class="row"><dt>Задание<span id="mainDur">15 мин</span></dt><dd id="main"></dd></div>
      <div class="row figure" id="exampleRow"><dt>Схема</dt><dd id="example"></dd></div>
      <div class="row"><dt><label for="note">Наблюдения</label></dt><dd><textarea id="note" rows="3"></textarea></dd></div>
    </dl>

    <div class="nav">
      <button class="btn ghost" id="prev" aria-label="Предыдущее занятие">Назад</button>
      <button class="btn primary" id="done">Задание выполнено</button>
    </div>
    <div class="nav secondary">
      <button class="link" id="openPlan">План программы</button>
      <button class="link" id="copyNotes">Копировать наблюдения</button>
    </div>

    <div class="drawer" id="drawer" hidden>
      <div class="drawer-head">
        <h2>План программы</h2>
        <button class="link" id="closePlan">Закрыть</button>
      </div>
      <div class="weeks" id="weeks"></div>
    </div>

  </section>

  <section class="sheet tool">
    <div class="tool-head">
      <div class="seg tabs" role="tablist">
        <button class="tab" data-tab="shapes">Формы</button>
        <button class="tab" data-tab="mannequin">Манекен</button>
        <button class="tab" data-tab="refs">Референсы</button>
        <button class="tab" data-tab="links">Ссылки</button>
      </div>
      <div class="timer" id="timer" hidden></div>
    </div>

    <div class="stage" id="stage">
      <div id="view3d"></div>
      <div id="viewRefs" hidden>
        <img id="refImg" alt="">
        <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="threeTones" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="1.2"/>
          <feColorMatrix type="matrix" values="0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0.299 0.587 0.114 0 0  0 0 0 1 0"/>
          <feComponentTransfer><feFuncR type="discrete" tableValues="0.23 0.6 0.91"/><feFuncG type="discrete" tableValues="0.23 0.6 0.91"/><feFuncB type="discrete" tableValues="0.23 0.6 0.91"/></feComponentTransfer>
        </filter></svg>
        <div class="empty" id="refEmpty">
          <p class="empty-title">Референсов пока нет</p>
          <p>Добавьте изображения в папку «Референсы»</p>
          <label class="btn primary">Выбрать изображения<input type="file" class="addFiles" accept="image/*" multiple hidden></label>
        </div>
      </div>
      <div id="viewLinks" hidden>
        <div class="links-wrap">
          <h2>Полезные ссылки</h2>
          <ul class="links" id="links"></ul>
        </div>
      </div>
      <div class="cover" id="cover"><p>Референс скрыт</p></div>

      <span class="caption tl" id="capView"></span>
      <span class="caption bl" id="capInfo"></span>

      <aside class="panel" id="panel">
        <button class="panel-head" id="panelToggle" aria-expanded="true">Параметры</button>
        <div class="panel-body">

          <div class="grp only-shapes"><button class="btn primary wide" id="newScene">Новая сцена</button></div>

          <div class="grp only-mannequin">
            <span class="lbl">Поза</span>
            <div class="seg" id="poseBtns">
              <button data-kind="any" class="on">Любая</button>
              <button data-kind="stand">Стоя</button>
              <button data-kind="sit">Сидя</button>
              <button data-kind="action">Движение</button>
            </div>
          </div>

          <div class="grp only-3d">
            <span class="lbl">Ракурс</span>
            <div class="seg" id="angleSeg">
              <button data-v="rand" class="on">Любой</button>
              <button data-v="eye">Прямо</button>
              <button data-v="low">Снизу</button>
              <button data-v="high">Сверху</button>
            </div>
          </div>

          <div class="grp only-3d">
            <label class="sw"><span>Широкий объектив</span><input type="checkbox" id="wide"><i></i></label>
            <label class="sw"><span>Три тона</span><input type="checkbox" id="toon"><i></i></label>
          </div>

          <div class="grp only-3d">
            <span class="lbl">Свет</span>
            <label class="rng"><span>Направление</span><input type="range" id="lampAz" min="0" max="360" value="45"></label>
            <label class="rng"><span>Высота</span><input type="range" id="lampEl" min="-30" max="85" value="50"></label>
          </div>

          <div class="grp only-3d">
            <label class="rng"><span>Яркость фона</span><input type="range" id="bgLevel" min="0" max="100" value="85"></label>
          </div>

          <div class="grp only-refs"><button class="btn primary wide" id="nextRef">Следующее изображение</button></div>
          <div class="grp only-refs">
            <label class="sw"><span>Зеркально</span><input type="checkbox" id="mirror"><i></i></label>
            <label class="sw"><span>Чёрно-белое</span><input type="checkbox" id="gray"><i></i></label>
            <label class="sw"><span>Три тона</span><input type="checkbox" id="tones"><i></i></label>
            <label class="link file">Добавить изображения<input type="file" class="addFiles" accept="image/*" multiple hidden></label>
          </div>

          <div class="grp">
            <span class="lbl">Таймер</span>
            <div class="seg" id="timerSeg">
              <button data-v="0" class="on">Выкл</button>
              <button data-v="30">30 с</button>
              <button data-v="60">1 мин</button>
              <button data-v="120">2 мин</button>
              <button data-v="300">5 мин</button>
            </div>
          </div>

          <div class="grp"><button class="btn ghost wide" id="hideBtn">Скрыть референс</button></div>
        </div>
      </aside>
    </div>
  </section>
</div>

<script src="app/three.min.js"></script>
<script src="app/OrbitControls.js"></script>
<script src="app/plan.js" charset="utf-8"></script>
<script src="app/examples.js" charset="utf-8"></script>
<script src="app/refs.js" charset="utf-8"></script>
<script src="app/links.js" charset="utf-8"></script>
<script src="app/app.js" charset="utf-8"></script>
</body>
</html>
